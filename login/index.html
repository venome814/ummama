<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | ummama</title>
    <style>
      :root {
        --bg: #fff7fb;
        --panel: rgba(255,255,255,0.82);
        --primary: #ff74af;
        --primary-deep: #ea4f8d;
        --text: #4e2b41;
        --muted: #865d79;
        --line: rgba(138, 88, 116, 0.18);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top, rgba(255, 176, 214, 0.8), transparent 30%),
          linear-gradient(135deg, #fff7fb 0%, #ffeaf5 100%);
        color: var(--text);
      }
      .login-card {
        width: min(430px, calc(100% - 28px));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 28px 24px 22px;
        box-shadow: 0 22px 44px rgba(201, 111, 156, 0.18);
        backdrop-filter: blur(10px);
      }
      .badge {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(255, 116, 175, 0.12);
        color: var(--primary-deep);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: clamp(2.1rem, 4vw, 3rem);
      }
      p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.7;
      }
      form {
        display: grid;
        gap: 14px;
      }
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 1rem;
        outline: none;
      }
      input:focus {
        border-color: rgba(234, 79, 141, 0.5);
        box-shadow: 0 0 0 4px rgba(255, 116, 175, 0.08);
      }
      button {
        border: none;
        border-radius: 14px;
        padding: 14px 18px;
        font-size: 0.98rem;
        font-weight: 700;
        color: white;
        background: linear-gradient(135deg, var(--primary), var(--primary-deep));
        box-shadow: 0 16px 28px rgba(255, 116, 175, 0.25);
        cursor: pointer;
      }
      .btn.danger {
        background: linear-gradient(135deg, #f27aa6, #d93d75);
      }
      .error {
        min-height: 20px;
        color: #c64a6d;
        font-size: 0.85rem;
      }
      .tiny {
        margin-top: 14px;
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-align: center;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <span class="badge">Admin Access</span>
      <h1>Login</h1>
      <p>Enter the password to open the control panel.</p>

      <form id="loginForm" novalidate>
        <input id="passwordInput" type="password" placeholder="Password" aria-label="Password" />
        <button type="submit">Unlock</button>
      </form>

      <div id="loginError" class="error" aria-live="polite"></div>
      <div class="tiny">Password: ummama</div>
    </div>

    <aside id="controlPanel" class="control-panel" aria-label="Control panel" style="display: none; position: static; transform: none; opacity: 1; pointer-events: auto; width: min(900px, calc(100% - 24px)); max-height: none; margin: 26px auto 0;">
      <div class="panel-header">
        <h3>Admin Control Panel</h3>
        <button id="closePanelBtn" class="close-btn" type="button" aria-label="Close panel">✕</button>
      </div>

      <div class="panel-section">
        <h4>Profile</h4>
        <form id="profileForm" class="stack-form">
          <label>
            Name
            <input id="profileNameInput" type="text" placeholder="ummama" />
          </label>
          <label>
            Profile picture URL
            <input id="profilePicInput" type="url" placeholder="https://..." />
          </label>
          <label>
            Hero message
            <textarea id="messageInput" rows="4" placeholder="Your sweet note..."></textarea>
          </label>
          <button class="btn primary full" type="submit">Save profile</button>
        </form>
      </div>

      <div class="panel-section">
        <h4>Gallery</h4>
        <form id="galleryForm" class="stack-form compact-form">
          <label>
            Photo title
            <input id="galleryTitleInput" type="text" placeholder="Sunset walk" />
          </label>
          <label>
            Photo URL
            <input id="galleryUrlInput" type="url" placeholder="https://..." />
          </label>
          <label class="file-input-wrap">
            Or upload image
            <input id="galleryFileInput" type="file" accept="image/*" />
          </label>
          <button class="btn secondary full" type="submit">Add gallery photo</button>
        </form>
        <div id="galleryManager" class="manager-list"></div>
      </div>

      <div class="panel-section">
        <h4>Music</h4>
        <form id="musicForm" class="stack-form compact-form">
          <label>
            Song title
            <input id="musicTitleInput" type="text" placeholder="Dreams" />
          </label>
          <label>
            Artist
            <input id="musicArtistInput" type="text" placeholder="Fleetwood Mac" />
          </label>
          <label>
            YouTube / Spotify link
            <input id="musicUrlInput" type="url" placeholder="https://..." />
          </label>
          <button class="btn secondary full" type="submit">Add music</button>
        </form>
        <div id="musicManager" class="manager-list"></div>
      </div>

      <div class="panel-section">
        <h4>Social Links</h4>
        <form id="socialForm" class="stack-form compact-form">
          <label>
            Platform
            <input id="socialPlatformInput" type="text" placeholder="Instagram" />
          </label>
          <label>
            Link
            <input id="socialUrlInput" type="url" placeholder="https://..." />
          </label>
          <button class="btn secondary full" type="submit">Add social link</button>
        </form>
        <div id="socialManager" class="manager-list"></div>
      </div>

      <div class="panel-section">
        <h4>Favorite Things</h4>
        <form id="favoritesForm" class="stack-form compact-form">
          <label>
            Favorite list (comma separated)
            <textarea id="favoritesInput" rows="4" placeholder="Pink sunsets, songs, movies, noodles"></textarea>
          </label>
          <button class="btn secondary full" type="submit">Update favorites</button>
        </form>
      </div>

      <div class="panel-section">
        <button id="clearAllBtn" class="btn danger full" type="button">Remove all text / photos / content</button>
      </div>
    </aside>

    <script src="/script.js"></script>
    <script>
      const correctPassword = 'ummama';
      const loginForm = document.getElementById('loginForm');
      const passwordInput = document.getElementById('passwordInput');
      const loginError = document.getElementById('loginError');
      const adminPanel = document.getElementById('controlPanel');

      function setAdminVisible(show) {
        adminPanel.style.display = show ? 'block' : 'none';
      }

      if (localStorage.getItem('ummama-admin-auth') === 'true') {
        setAdminVisible(true);
        document.querySelector('.login-card').style.display = 'none';
      }

      loginForm.addEventListener('submit', function (event) {
        event.preventDefault();
        const value = passwordInput.value.trim();

        if (value === correctPassword) {
          localStorage.setItem('ummama-admin-auth', 'true');
          setAdminVisible(true);
          document.querySelector('.login-card').style.display = 'none';
          return;
        }

        loginError.textContent = 'Wrong password. Please try again.';
        passwordInput.value = '';
        passwordInput.focus();
      });
    </script>
  </body>
</html>
